<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Oswald:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden} canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./three/build/three.module.js", "three/addons/": "./three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const DATA = window.MAP;
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = DATA.exposure ?? 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const mood = DATA.mood || 'day';
const SKY = {
  day: { top: 0x6fa6dc, bottom: 0xcfe3ef, hemi: [0xdfefff, 0x6b5f45, 1.1], sun: [0xfff2dc, 2.4] },
  sunset: { top: 0x2e3a6e, bottom: 0xf3a060, hemi: [0xffd2a8, 0x3a3048, 0.9], sun: [0xffb070, 2.2] },
  night: { top: 0x05060f, bottom: 0x1a1f3a, hemi: [0x5a6aa8, 0x101018, 0.55], sun: [0x9fb4ff, 0.6] },
}[mood];

// Sky: a big sphere with a vertical gradient.
{
  const g = new THREE.SphereGeometry(4000, 32, 16);
  const top = new THREE.Color(SKY.top), bottom = new THREE.Color(SKY.bottom);
  const cols = [];
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const t = THREE.MathUtils.clamp(pos.getY(i) / 4000 * 1.6 + 0.35, 0, 1);
    const c = bottom.clone().lerp(top, t);
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, depthWrite: false })));
}

// The sky's light in glass and metal (Roblox lights shade and reflections from its sky), and
// haze so distance reads.
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = mood === 'night' ? 0.12 : 0.45;
  scene.fog = new THREE.Fog(SKY.bottom, mood === 'night' ? 160 : 420, mood === 'night' ? 1600 : 3200);
}
scene.add(new THREE.HemisphereLight(...SKY.hemi));
const sun = new THREE.DirectionalLight(SKY.sun[0], SKY.sun[1]);
scene.add(sun);
scene.add(sun.target);

// ------------------------------------------------------------------ parts --
const MATS = {
  Neon: null,
  Glass: { roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.45 },
  Metal: { roughness: 0.38, metalness: 0.65 },
  DiamondPlate: { roughness: 0.35, metalness: 0.7 },
  CorrodedMetal: { roughness: 0.7, metalness: 0.5 },
  Foil: { roughness: 0.25, metalness: 0.8 },
  SmoothPlastic: { roughness: 0.45, metalness: 0.0 },
  Plastic: { roughness: 0.55, metalness: 0.0 },
  Wood: { roughness: 0.8 }, WoodPlanks: { roughness: 0.85 },
  Concrete: { roughness: 0.95 }, Asphalt: { roughness: 0.97 }, Slate: { roughness: 0.9 },
  Brick: { roughness: 0.92 }, Cobblestone: { roughness: 0.95 }, Granite: { roughness: 0.85 },
  Marble: { roughness: 0.3 }, Pebble: { roughness: 0.95 }, Sand: { roughness: 1 },
  Grass: { roughness: 1 }, LeafyGrass: { roughness: 1 }, Fabric: { roughness: 1 }, Ice: { roughness: 0.1 },
  ForceField: { roughness: 0.2, transparent: true, opacity: 0.25 },
};
// Roblox's materials have texture; flat colour makes every surface look like plastic. Each
// is drawn once on a canvas (near-white, so the part's colour tints it) and tiled by world
// size: `tile` studs per repeat.
const TEX = {};
function noise(g, w, h, amount, alpha) {
  const img = g.getImageData(0, 0, w, h);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * amount;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n; img.data[i + 3] = alpha ?? 255;
  }
  g.putImageData(img, 0, 0);
}
function makeTexture(kind) {
  const N = 256;
  const c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = '#f0f0f0'; g.fillRect(0, 0, N, N);
  let tile = 4;
  if (kind === 'Brick') {
    tile = 4;
    const rows = 8, bw = N / 4;
    for (let r = 0; r < rows; r++) {
      const off = (r % 2) * bw / 2;
      for (let x = -bw; x < N + bw; x += bw) {
        const v = 215 + Math.floor(Math.random() * 35);
        g.fillStyle = `rgb(${v},${v},${v})`;
        g.fillRect(x + off + 2, r * (N / rows) + 2, bw - 4, N / rows - 4);
      }
    }
    g.fillStyle = 'rgba(150,150,150,1)';
    noise(g, N, N, 18);
    g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#a8a8a8'; g.fillRect(0, 0, N, N);
    g.globalCompositeOperation = 'source-over';
  } else if (kind === 'Concrete' || kind === 'Granite' || kind === 'Slate' || kind === 'Plaster') {
    tile = kind === 'Concrete' ? 10 : 6;
    noise(g, N, N, kind === 'Granite' ? 40 : 22);
    if (kind === 'Concrete') { g.strokeStyle = 'rgba(0,0,0,0.10)'; g.lineWidth = 2; g.strokeRect(1, 1, N - 2, N - 2); }
    if (kind === 'Slate') for (let i = 0; i < 9; i++) { g.fillStyle = `rgba(0,0,0,${0.03 + Math.random() * 0.05})`; g.fillRect(0, Math.random() * N, N, 6 + Math.random() * 18); }
  } else if (kind === 'Asphalt') {
    tile = 8; noise(g, N, N, 34);
  } else if (kind === 'Pavement' || kind === 'CeramicTiles') {
    tile = kind === 'Pavement' ? 6 : 3;
    noise(g, N, N, 14);
    g.strokeStyle = 'rgba(0,0,0,0.22)'; g.lineWidth = 3;
    for (let i = 0; i <= N; i += N / 2) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, N); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(N, i); g.stroke(); }
  } else if (kind === 'Cobblestone' || kind === 'Pebble') {
    tile = 4;
    g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, N, N);
    for (let i = 0; i < 70; i++) {
      const v = 200 + Math.floor(Math.random() * 50);
      g.fillStyle = `rgb(${v},${v},${v})`;
      g.beginPath(); g.ellipse(Math.random() * N, Math.random() * N, 12 + Math.random() * 14, 10 + Math.random() * 10, Math.random() * 3, 0, Math.PI * 2); g.fill();
    }
  } else if (kind === 'WoodPlanks' || kind === 'Wood') {
    tile = 4;
    const planks = kind === 'WoodPlanks' ? 4 : 1;
    for (let p = 0; p < planks; p++) {
      const v = 205 + Math.floor(Math.random() * 40);
      g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, p * N / planks, N, N / planks);
      for (let l = 0; l < 14; l++) { g.strokeStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.08})`; g.beginPath(); const y = p * N / planks + Math.random() * N / planks; g.moveTo(0, y); g.bezierCurveTo(N / 3, y + 4, N * 2 / 3, y - 4, N, y + 2); g.stroke(); }
      if (planks > 1) { g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(0, p * N / planks, N, 3); }
    }
  } else if (kind === 'Marble') {
    tile = 12; noise(g, N, N, 8);
    for (let i = 0; i < 6; i++) { g.strokeStyle = 'rgba(0,0,0,0.08)'; g.lineWidth = 1 + Math.random() * 2; g.beginPath(); let x = Math.random() * N, y = 0; g.moveTo(x, y); while (y < N) { x += (Math.random() - 0.5) * 40; y += 20; g.lineTo(x, y); } g.stroke(); }
  } else if (kind === 'DiamondPlate') {
    tile = 2; noise(g, N, N, 10);
    g.fillStyle = 'rgba(255,255,255,0.6)';
    for (let x = 0; x < N; x += 32) for (let y = 0; y < N; y += 32) { g.save(); g.translate(x + 16, y + 16); g.rotate(((x + y) / 32) % 2 ? 0.8 : -0.8); g.fillRect(-10, -3, 20, 6); g.restore(); }
  } else if (kind === 'Fabric') {
    tile = 2; for (let i = 0; i < N; i += 4) { g.fillStyle = 'rgba(0,0,0,0.06)'; g.fillRect(i, 0, 2, N); g.fillRect(0, i, N, 2); }
  } else if (kind === 'Grass' || kind === 'LeafyGrass' || kind === 'Ground' || kind === 'Mud') {
    tile = 8; noise(g, N, N, 50);
  } else if (kind === 'Metal' || kind === 'CorrodedMetal') {
    tile = 4; noise(g, N, N, kind === 'CorrodedMetal' ? 50 : 10);
  } else return null;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return { map: t, tile };
}
function textureFor(kind) {
  if (!(kind in TEX)) TEX[kind] = makeTexture(kind);
  return TEX[kind];
}

function material(p) {
  const color = new THREE.Color(`rgb(${p.c[0]},${p.c[1]},${p.c[2]})`);
  const opacity = 1 - (p.t || 0);
  if (p.m === 'Neon') {
    // Neon is unlit and over-bright, which is what makes it bloom.
    return new THREE.MeshBasicMaterial({ color: color.multiplyScalar(1.6), transparent: opacity < 1, opacity });
  }
  const spec = MATS[p.m] || { roughness: 0.6 };
  const tex = textureFor(p.m);
  const m = new THREE.MeshStandardMaterial({ color, roughness: spec.roughness ?? 0.6, metalness: spec.metalness ?? 0,
    map: tex ? tex.map : null });
  if (p.m === 'Glass') { m.envMapIntensity = 1.6; m.roughness = 0.04; }
  const o = Math.min(opacity, spec.opacity ?? 1);
  if (o < 1 || spec.transparent) { m.transparent = true; m.opacity = o; m.depthWrite = o > 0.6; }
  if (p.rf) m.metalness = Math.max(m.metalness, p.rf * 0.8);
  return m;
}

function wedgeGeometry(sx, sy, sz) {
  // Roblox wedge: full bottom, vertical back face (+Z), slope rising from front-bottom.
  const shape = new THREE.Shape();
  shape.moveTo(-sz / 2, -sy / 2);
  shape.lineTo(sz / 2, -sy / 2);
  shape.lineTo(sz / 2, sy / 2);
  shape.lineTo(-sz / 2, -sy / 2);
  const g = new THREE.ExtrudeGeometry(shape, { depth: sx, bevelEnabled: false });
  g.translate(0, 0, -sx / 2);
  g.rotateY(-Math.PI / 2);   // extrude axis -> X, shape x -> Z
  return g;
}

const geoCache = new Map();
function geometry(p) {
  const [sx, sy, sz] = p.z;
  const tex = textureFor(p.m);
  const tile = tex ? tex.tile : 0;
  const key = `${p.s}|${sx.toFixed(3)}|${sy.toFixed(3)}|${sz.toFixed(3)}|${tile}`;
  if (geoCache.has(key)) return geoCache.get(key);
  let g;
  if (p.s === 'Ball') g = new THREE.SphereGeometry(Math.min(sx, sy, sz) / 2, 20, 14);
  else if (p.s === 'Cylinder') { g = new THREE.CylinderGeometry(Math.min(sy, sz) / 2, Math.min(sy, sz) / 2, sx, 24); g.rotateZ(Math.PI / 2); }
  else if (p.s === 'Wedge' || p.s === 'CornerWedge') g = wedgeGeometry(sx, sy, sz);
  else {
    g = new THREE.BoxGeometry(sx, sy, sz);
    if (tile) {
      // Tile the texture by world size: each face's u,v spans its own two dimensions.
      const uv = g.attributes.uv;
      const dims = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];
      for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
        const i = f * 4 + v;
        uv.setXY(i, uv.getX(i) * dims[f][0] / tile, uv.getY(i) * dims[f][1] / tile);
      }
    }
  }
  geoCache.set(key, g);
  return g;
}

const bounds = new THREE.Box3();
for (const p of DATA.parts) {
  const mesh = new THREE.Mesh(geometry(p), material(p));
  const m = new THREE.Matrix4().set(
    p.r[0], p.r[1], p.r[2], p.p[0],
    p.r[3], p.r[4], p.r[5], p.p[1],
    p.r[6], p.r[7], p.r[8], p.p[2],
    0, 0, 0, 1);
  mesh.matrixAutoUpdate = false;
  mesh.matrix.copy(m);
  const isNeon = p.m === 'Neon';
  mesh.castShadow = !isNeon && (p.t || 0) < 0.5;
  mesh.receiveShadow = !isNeon;
  scene.add(mesh);
  if (p.z[0] < 400 && p.z[2] < 400) bounds.expandByPoint(new THREE.Vector3(...p.p));
}

// ----------------------------------------------------------------- people --
// The players' own rig for scale: the Roblox Boy in a white tee and dark trousers.
if (DATA.rig && DATA.figures) {
  const SKIN = 0xd2a88a, TEE = 0xf4f4f0, PANTS = 0x2b2f38, SHOE = 0xf0f0ec;
  const DRESS = { Head: SKIN, UpperTorso: TEE, LowerTorso: PANTS, LeftUpperArm: TEE, RightUpperArm: TEE,
    LeftLowerArm: SKIN, RightLowerArm: SKIN, LeftHand: SKIN, RightHand: SKIN, LeftUpperLeg: PANTS,
    RightUpperLeg: PANTS, LeftLowerLeg: PANTS, RightLowerLeg: PANTS, LeftFoot: SHOE, RightFoot: SHOE };
  for (const f of DATA.figures) {
    const [x, y, z, yaw] = f;
    const root = new THREE.Matrix4().makeRotationY(THREE.MathUtils.degToRad(yaw || 0));
    root.setPosition(x, y + DATA.rig.stand, z);
    for (const part of DATA.rig.parts) {
      const [px, py, pz] = part.z;
      const geo = part.n === 'Head' ? new THREE.CylinderGeometry(Math.min(px, pz) / 2, Math.min(px, pz) / 2, py, 20)
        : new RoundedBoxGeometry(px * 0.98, py * 0.98, pz * 0.98, 2, Math.min(px, py, pz) * 0.22);
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: DRESS[part.n] ?? 0x888888, roughness: 0.55 }));
      const m = part.m;
      const local = new THREE.Matrix4().set(m[3], m[4], m[5], m[0], m[6], m[7], m[8], m[1], m[9], m[10], m[11], m[2], 0, 0, 0, 1);
      mesh.matrixAutoUpdate = false;
      mesh.matrix.multiplyMatrices(root, local);
      mesh.castShadow = true;
      scene.add(mesh);
    }
  }
}

// ------------------------------------------------------------------ lights --
const lights = [...(DATA.lights || [])].sort((a, b) => b.b * b.range - a.b * a.range).slice(0, 28);
for (const l of lights) {
  const color = new THREE.Color(`rgb(${l.c[0]},${l.c[1]},${l.c[2]})`);
  let light;
  if (l.k === 'SpotLight' || l.k === 'SurfaceLight') {
    light = new THREE.SpotLight(color, l.b * 30, l.range * 1.4, THREE.MathUtils.degToRad(Math.min(l.angle, 89)) , 0.5, 1.2);
    light.position.set(...l.p);
    light.target.position.set(l.p[0] + l.d[0] * 10, l.p[1] + l.d[1] * 10, l.p[2] + l.d[2] * 10);
    scene.add(light.target);
  } else {
    light = new THREE.PointLight(color, l.b * 18, l.range * 1.3, 1.2);
    light.position.set(...l.p);
  }
  scene.add(light);
}

// ------------------------------------------------------------------- signs --
function signTexture(s, pxW, pxH) {
  const c = document.createElement('canvas');
  c.width = pxW; c.height = pxH;
  const g = c.getContext('2d');
  const text = s.text || '';
  let size = pxH * 0.8;
  g.font = `${size}px "Fredoka One"`;
  while (g.measureText(text).width > pxW * 0.94 && size > 8) { size *= 0.92; g.font = `${size}px "Fredoka One"`; }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (s.sc) {
    g.shadowColor = `rgb(${s.sc})`; g.shadowBlur = size * 0.35;
    g.lineWidth = size * 0.12; g.strokeStyle = `rgb(${s.sc})`;
    g.strokeText(text, pxW / 2, pxH / 2);
  }
  g.shadowBlur = 0;
  g.fillStyle = `rgba(${s.c},${1 - (s.tt || 0)})`;
  g.fillText(text, pxW / 2, pxH / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const FACE_ROT = {
  Front: [0, Math.PI, 0], Back: [0, 0, 0], Top: [-Math.PI / 2, 0, 0], Bottom: [Math.PI / 2, 0, 0],
  Left: [0, -Math.PI / 2, 0], Right: [0, Math.PI / 2, 0],
};
const FACE_NORMAL = { Front: [0, 0, -1], Back: [0, 0, 1], Top: [0, 1, 0], Bottom: [0, -1, 0], Left: [-1, 0, 0], Right: [1, 0, 0] };
function addSigns() {
  for (const s of DATA.signs || []) {
    if (!s.text) continue;
    const pxW = Math.min(2048, Math.max(64, Math.round(s.w * 40))), pxH = Math.min(1024, Math.max(32, Math.round(s.h * 40)));
    const mat = new THREE.MeshBasicMaterial({ map: signTexture(s, pxW, pxH), transparent: true, depthWrite: false });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(s.w, s.h), mat);
    const partRot = new THREE.Matrix4().set(s.r[0], s.r[1], s.r[2], 0, s.r[3], s.r[4], s.r[5], 0, s.r[6], s.r[7], s.r[8], 0, 0, 0, 0, 1);
    const faceRot = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(...FACE_ROT[s.face] || FACE_ROT.Front));
    const n = new THREE.Vector3(...(FACE_NORMAL[s.face] || FACE_NORMAL.Front)).applyMatrix4(partRot).multiplyScalar(0.03);
    const m = new THREE.Matrix4().multiplyMatrices(partRot, faceRot);
    m.setPosition(s.p[0] + n.x, s.p[1] + n.y, s.p[2] + n.z);
    plane.matrixAutoUpdate = false;
    plane.matrix.copy(m);
    scene.add(plane);
  }
}

// ------------------------------------------------------------------ camera --
const camera = new THREE.PerspectiveCamera(60, W / H, 0.5, 9000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// (Roblox blooms only what is brighter than its threshold, 1.7 here: neon, lamps, the sun on
// glass -- never a pale pavement in daylight.)
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), mood === 'night' ? 0.9 : 0.45, 0.55, mood === 'night' ? 0.82 : 1.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const centre = bounds.getCenter(new THREE.Vector3());
const span = bounds.getSize(new THREE.Vector3());
const reach = Math.max(span.x, span.z, 40);
sun.position.set(centre.x + reach * 0.6, centre.y + reach * 1.1, centre.z + reach * 0.35);
sun.target.position.copy(centre);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera;
sc.left = -reach; sc.right = reach; sc.top = reach; sc.bottom = -reach; sc.near = 1; sc.far = reach * 4;
sun.shadow.bias = -0.0004;

window.renderView = (i) => {
  const cams = DATA.cameras && DATA.cameras.length ? DATA.cameras : [
    { pos: [centre.x + reach * 0.7, centre.y + reach * 0.55, centre.z + reach * 0.7], look: [centre.x, centre.y, centre.z], fov: 50 },
  ];
  const c = cams[i % cams.length];
  camera.fov = c.fov || 60;
  camera.updateProjectionMatrix();
  camera.position.set(...c.pos);
  camera.lookAt(new THREE.Vector3(...c.look));
  // A big world: fit the sun's shadow round what this view looks at, so shadows stay sharp.
  if (reach > 400) {
    const target = new THREE.Vector3(...c.look);
    const r = Math.min(reach, Math.max(160, camera.position.distanceTo(target) * 1.3));
    sun.position.set(target.x + r * 0.6, target.y + r * 1.4, target.z + r * 0.45);
    sun.target.position.copy(target);
    sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.far = r * 5;
    sc.updateProjectionMatrix();
  }
  composer.render();
  return cams.length;
};

document.fonts.ready.then(() => {
  addSigns();
  window.MAP_READY = true;
});
</script>
</body>
</html>
